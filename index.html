<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f4">
  <title>Mrs Happy Chicken</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="game-shell" aria-label="Mrs Happy Chicken game">
      <button id="playfield" aria-label="Lay an egg. You can also press the spacebar.">
        <svg id="scene" viewBox="0 0 1000 640" aria-hidden="true">
          <defs>
            <g id="bird-body" stroke="#24251b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-33 5q-23-15-25-5l8 5q-14 0-10 8l9 2q-11 5-4 10l20-6" fill="#f9ec32"/>
              <path d="M-13-37q-11-25-2-25l6 10q3-19 9-13l3 12q11-18 16-10 5 17-8 25" fill="#e5232c"/>
              <g fill="#f9ec32">
                <path id="beak-upper" d="M24-29 60-8 30-8Z" transform="rotate(-28 30 -8)"/>
                <path id="beak-lower" d="M30-8 60-8 24 13Z" transform="rotate(28 30 -8)"/>
              </g>
              <path d="M-42 0C-43-24-26-41-3-41 23-43 42-26 42-2 43 22 28 40 3 40-24 41-41 23-42 0Z" fill="#f9ec32"/>
              <circle cx="18" cy="-18" r="5" fill="#24251b" stroke="none"/>
            </g>
            <path id="bird-leg" d="M0 27v29m0-5-7 5m7-5 7 5" fill="none" stroke="#24251b" stroke-width="4" stroke-linecap="round"/>
            <g id="bird">
              <use href="#bird-leg" transform="translate(-18 -6)"/>
              <use href="#bird-leg" transform="translate(18 0)"/>
              <use href="#bird-body"/>
            </g>
            <g id="bird-step">
              <use href="#bird-leg" transform="translate(-18 0)"/>
              <use href="#bird-leg" transform="translate(18 -6)"/>
              <use href="#bird-body"/>
            </g>
            <g id="chick-body" stroke="#24251b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="m19-7 10 4-10 5Z" fill="#ffce53"/>
              <circle r="23" fill="#ffe65c"/>
              <circle cx="10" cy="-8" r="4" fill="#24251b" stroke="none"/>
              <circle cx="11" cy="-9.5" r="1.2" fill="#fffbed" stroke="none"/>
            </g>
            <path id="chick-leg" d="M0 17v15m0-3-4 3m4-3 4 3" fill="none" stroke="#24251b" stroke-width="2.5" stroke-linecap="round"/>
            <g id="chick">
              <use href="#chick-leg" transform="translate(-9 -3)"/>
              <use href="#chick-leg" transform="translate(9 0)"/>
              <use href="#chick-body"/>
            </g>
            <g id="chick-step">
              <use href="#chick-leg" transform="translate(-9 0)"/>
              <use href="#chick-leg" transform="translate(9 -3)"/>
              <use href="#chick-body"/>
            </g>
            <clipPath id="chick-in-shell" clipPathUnits="userSpaceOnUse">
              <rect x="-40" y="-45" width="80" height="65"/>
            </clipPath>
            <g id="egg"><path d="M0-28C-14-28-25-6-25 9c0 28 50 28 50 0C25-6 14-28 0-28Z" fill="#fffbb0" stroke="#24251b" stroke-width="3"/></g>
            <g id="cracked-egg"><use href="#egg"/><path d="m-23-2 8 8 7-11 9 11 8-10 8 9 6-8" fill="none" stroke="#24251b" stroke-width="3" stroke-linejoin="round"/></g>
            <path id="shell-bottom" d="m-24-2 9 8 7-11 9 11 8-10 8 9 6-8c8 43-55 43-47 1Z" fill="#fffbb0" stroke="#24251b" stroke-width="3" stroke-linejoin="round"/>
            <path id="shell-top" d="M-24-2C-18-38 17-38 24-3l-7 8-8-9-8 10-9-11-7 11Z" fill="#fffbb0" stroke="#24251b" stroke-width="3" stroke-linejoin="round"/>
          </defs>
          <g id="flock"><g id="hen"><use id="hen-sprite" href="#bird"/></g></g>
        </svg>
      </button>
      <div class="score" aria-label="Chicks hatched"><span id="count">000</span></div>
      <div class="input-hint" aria-hidden="true">
        <svg viewBox="0 0 430 150" fill="none" stroke="#005b83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(-310 0)">
          <!-- A fingertip tapping the screen, with the same six click rays. -->
          <ellipse cx="369" cy="88" rx="51" ry="58" fill="#007ab6" fill-opacity="0.75" stroke="none"/>
          <circle cx="356" cy="43" r="16" fill="#ffdf57" stroke="none"/>
          <path d="M348 91V45q0-8 8-8t8 8v32q9-6 15 4 10-5 16 5 12-2 12 11v18q0 20-18 20h-19q-12 0-20-11l-23-27q-5-7 1-11t11 0l9 10Z" fill="#fffbed"/>
          <path d="M348 27l-5-7m13 4V14m8 13 5-7M348 59l-5 7m13-4v10m8-13 5 7" stroke="#222" stroke-width="4"/>
          </g>
          <g transform="translate(130 0)">
          <ellipse cx="91" cy="92" rx="90" ry="53" fill="#007ab6" fill-opacity="0.75" stroke="none"/>
          <ellipse cx="245" cy="81" rx="47" ry="67" fill="#007ab6" fill-opacity="0.75" stroke="none"/>
          <!-- Keyboard with its spacebar pressed. -->
          <rect x="8" y="53" width="167" height="78" rx="12" fill="#bde7f1"/>
          <rect x="19" y="63" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="49" y="63" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="79" y="63" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="109" y="63" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="139" y="63" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="19" y="82" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="49" y="82" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="79" y="82" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="109" y="82" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="139" y="82" width="23" height="13" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="19" y="103" width="23" height="17" rx="3" fill="#fffbed" stroke-width="2"/>
          <rect x="49" y="106" width="83" height="14" rx="3" fill="#ffdf57" stroke-width="2"/>
          <rect x="139" y="103" width="23" height="17" rx="3" fill="#fffbed" stroke-width="2"/>
          <!-- The left button follows the same outer contour as the mouse. -->
          <g transform="translate(213 29)">
            <path d="M32 0C12 0 0 14 0 34v34c0 24 14 36 32 36s32-12 32-36V34C64 14 52 0 32 0Z" fill="#fffbed" stroke="none"/>
            <path d="M32 0C12 0 0 14 0 34v10h32Z" fill="#ffdf57" stroke="none"/>
            <path d="M32 0C12 0 0 14 0 34v34c0 24 14 36 32 36s32-12 32-36V34C64 14 52 0 32 0Z"/>
            <path d="M32 0v44M0 44h64"/>
            <rect x="28" y="18" width="8" height="15" rx="4" fill="#005b83" stroke="none"/>
          </g>
          <path d="M81 102l-6-7m16 5V90m10 12 6-7M81 125l-6 7m16-5v10m10-12 6 7M221 41l-5-7m13 4V28m8 13 5-7M221 63l-5 7m13-4v10m8-13 5 7" stroke="#222" stroke-width="4"/>
          </g>
        </svg>
      </div>
      <div class="game-controls">
        <button id="sound" aria-label="Turn sound off" aria-pressed="true">
          <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16h6l8-7v22l-8-7H7Z" fill="currentColor" stroke="none"/>
            <g class="sound-waves"><path d="M26 14q6 6 0 12m5-17q11 11 0 22"/></g>
            <path class="sound-muted" d="m27 16 8 8m0-8-8 8"/>
          </svg>
        </button>
        <button id="fullscreen" aria-label="Enter fullscreen" aria-pressed="false" hidden>
          <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path class="fullscreen-enter" d="M15 7H7v8m18-8h8v8M7 25v8h8m18-8v8h-8"/>
            <path class="fullscreen-exit" d="M7 15h8V7m18 8h-8V7M15 33v-8H7m18 8v-8h8"/>
          </svg>
        </button>
        <button id="reset" aria-label="Start again">
          <svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 12a13 13 0 1 1-3 14"/>
            <path d="M10 5v9h9"/>
          </svg>
        </button>
      </div>
    </section>
  </main>
  <script src="motion.js"></script>
  <script src="game.js"></script>
</body>
</html>
